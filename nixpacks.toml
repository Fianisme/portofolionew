[phases.setup]
nixPkgs = ["...", "php84", "php84Packages.composer", "nodejs_20"]

[phases.install]
dependsOn = ["setup"]
cmds = [
    "composer install --optimize-autoloader --no-dev --no-interaction",
    "npm ci || npm install",
    "npm run build"
]

[start]
cmd = "cp -n .env.example .env; php artisan key:generate --force; chmod -R 777 storage bootstrap/cache; php artisan serve --host=0.0.0.0 --port=$PORT"
